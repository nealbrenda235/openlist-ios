name: build-ipa

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list -project OlClient.xcodeproj

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project OlClient.xcodeproj \
            -scheme OpenList \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log

      - name: Show errors on failure
        if: failure()
        run: |
          echo "================ 编译错误 ================"
          grep -E "error:" build.log || echo "（未找到 error: 行，检查上方日志）"
          echo "================ 警告统计 ================"
          grep -c "warning:" build.log || true

      - name: Package IPA
        if: success()
        run: |
          APP="build/Build/Products/Release-iphoneos/OpenList.app"
          if [ ! -d "$APP" ]; then
            echo "构建产物不存在：$APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload OpenList.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenList.ipa Payload
          ls -lh OpenList.ipa
          shasum -a 256 OpenList.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenList-ipa
          path: OpenList.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
